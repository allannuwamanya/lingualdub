name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pip-audit

      - name: Run pip-audit strict
        run: |
          # Audit only the dependency closure end users actually install: the
          # `[project] dependencies` table in pyproject. Auditing the dev
          # environment instead would gate on CVEs in ruff/mypy/pytest, none of
          # which ship to users. The optional extras (models, eval) are large
          # model stacks and are audited separately/lazily rather than per-push.
          python -c "import pathlib, tomllib; \
            deps = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']; \
            pathlib.Path('/tmp/runtime-requirements.txt').write_text('\n'.join(deps) + '\n'); \
            print('Auditing runtime requirements:', deps)"
          pip-audit --strict -r /tmp/runtime-requirements.txt
          echo "pip-audit passed — no critical/high CVEs found"

      - name: Verify security docs exist
        run: |
          test -f docs/security.md || (echo "docs/security.md missing" && exit 1)
          grep -q "pip-audit" docs/security.md || (echo "docs/security.md must document pip-audit policy" && exit 1)
